[package]
name = "nodekilla"
version = "0.2.1"
edition = "2024"
description = "The simplest node_modules grim reaper written in 🦀Rust."
license = "MIT"
authors = ["Changda (Steven) Han <hi@nidexingg.com>"]
repository = "https://github.com/nidexingg/nodekilla"

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/nodekilla", dest = "/usr/bin/nodekilla", mode = "755" },
]