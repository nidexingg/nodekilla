name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: nodekilla-linux-x86_64
            ext: ""
          - os: ubuntu-24.04-arm
            asset_name: nodekilla-linux-arm64
            ext: ""
          - os: macos-15-intel
            asset_name: nodekilla-macos-x86_64
            ext: ""
          - os: macos-15
            asset_name: nodekilla-macos-arm64
            ext: ""
          - os: windows-latest
            asset_name: nodekilla-windows-x86_64
            ext: ".exe"
          - os: windows-11-arm
            asset_name: nodekilla-windows-arm64
            ext: ".exe"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Rust toolchain is installed
        shell: bash
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustc --version
          cargo --version

      - name: Build release binary
        shell: bash
        run: |
          cargo build --release
          mkdir -p dist
          cp "target/release/nodekilla${{ matrix.ext }}" "dist/${{ matrix.asset_name }}${{ matrix.ext }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}${{ matrix.ext }}

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*